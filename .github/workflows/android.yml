name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Unit tests, lint, release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Caches ~/.gradle and validates gradle-wrapper.jar checksums.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # compileSdk 37 minor 2 -> platforms;android-37.2; AGP 9.5 uses build-tools 36.0.0.
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;36.0.0"

      # Release is signed with the debug key (see app/build.gradle.kts); AGP creates it on the runner.
      - name: Build and test
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Upload release APKs
        uses: actions/upload-artifact@v7
        with:
          name: localcast-release-apks
          path: |
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error

      - name: Upload lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn

      - name: Upload unit test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

  viewer-e2e:
    name: Viewer page e2e (mock phone + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/e2e
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/e2e/package-lock.json

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test viewer.spec.mjs

      - name: Upload screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: viewer-e2e-screenshots
          path: tools/e2e/out/
          if-no-files-found: ignore
