<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="color-scheme" content="dark">
<title>LocalCast</title>
<style>
:root{--bg:#07090d;--card:#121620;--card-hi:#171c28;--line:#252c3a;--fg:#e8ecf3;--dim:#a0a9bb;
--acc:#1e5eff;--acc-hi:#6b93ff;--live:#ff4f5e;--ok:#3dd68c;--warn:#ffb547;--err:#ff7a84;
--glass:rgba(18,22,32,.78);--glass-hi:rgba(34,41,56,.92);
--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;
font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
background:radial-gradient(120vmax 70vmax at 50% -20%,rgba(30,94,255,.22),rgba(30,94,255,0) 60%),var(--bg)}
#stage.live{background:#000}
#stage.idle,#stage.idle *{cursor:none}
/* contain = letterbox/pillarbox on black, e.g. a 16:10 tablet on a 16:9 projector: never crop, never stretch. */
video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;background:transparent;display:block;opacity:0;transition:opacity .25s}
#stage.live video{opacity:1;background:#000}
/* Paused: the video stays laid out (only transparent) so the browser keeps its media wake lock; see keep-awake note in the script. */
#stage.live.paused video{opacity:0}
#pause{position:absolute;left:0;top:0;width:100%;height:100%;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:24px;text-align:center;
background:radial-gradient(120vmax 70vmax at 50% -20%,rgba(30,94,255,.14),rgba(30,94,255,0) 60%),var(--bg);pointer-events:none}
#stage.live.paused #pause{display:flex}
#pause .pi{width:72px;height:72px;margin-bottom:14px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
#pause .pi svg{width:28px;height:28px}
#pause h2{margin:0;font-size:clamp(22px,3.2vw,40px);line-height:1.25;font-weight:700;letter-spacing:-.01em}
#pause p{margin:0;color:var(--dim);font-size:clamp(15px,1.6vw,22px);max-width:32em}
video::-webkit-media-controls{display:none!important}
.card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100vw - 32px),400px);overflow:auto;
background:linear-gradient(180deg,var(--card-hi),var(--card));border:1px solid var(--line);border-radius:24px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);padding:32px 28px 28px;text-align:center;
box-shadow:0 24px 64px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.02) inset}
.card[hidden],#pill[hidden],#playbtn[hidden],#stats[hidden],#pinform[hidden],#spin[hidden]{display:none}
.logo{display:block;width:64px;height:64px;margin:0 auto 18px;border-radius:19px;overflow:hidden;box-shadow:0 8px 24px rgba(30,94,255,.35)}
h1{font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.01em;margin:0 0 8px}
#sub{color:var(--dim);margin:0;min-height:1.45em;font-size:15px}
#spin{width:32px;height:32px;margin:20px auto 4px;border:3px solid var(--line);border-top-color:var(--acc-hi);border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#pinform{margin-top:22px}
#pin{width:100%;height:68px;font:700 34px/1 var(--mono);letter-spacing:.35em;text-align:center;padding:0 8px 0 calc(8px + .35em);
background:#0a0d13;color:var(--fg);border:1.5px solid var(--line);border-radius:16px;outline:none;transition:border-color .15s,box-shadow .15s;
-webkit-user-select:text;user-select:text}
#pin::placeholder{color:#3a4354}
#pin:focus{border-color:var(--acc-hi);box-shadow:0 0 0 4px rgba(30,94,255,.3)}
#err{color:var(--err);min-height:1.45em;margin:12px 0 0;font-size:15px;font-weight:500}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--acc-hi);outline-offset:2px}
#go{width:100%;min-height:54px;margin-top:12px;padding:14px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-weight:600;font-size:17px;transition:filter .15s,opacity .15s}
#go:hover:not(:disabled){filter:brightness(1.12)}
#go:disabled{background:#243049;color:#93a0b8;cursor:default}
#pill{position:absolute;left:calc(12px + var(--sal));top:calc(12px + var(--sat));display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 16px 8px 14px;border-radius:999px;
background:var(--glass);border:1px solid rgba(255,255,255,.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:14px;font-weight:500;max-width:calc(100vw - 140px);transition:opacity .25s}
#stage.idle #pill:not(.problem){opacity:0}
#dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.06)}
#bar{position:absolute;right:calc(12px + var(--sar));top:calc(12px + var(--sat));display:flex;gap:10px;transition:opacity .25s}
#stage.idle #bar{opacity:0;pointer-events:none}
#bar button{width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.06);border-radius:50%;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#bar button:hover{background:var(--glass-hi)}
#bar button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#bar svg{width:22px;height:22px}
#playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-height:54px;padding:14px 26px;border:0;border-radius:16px;background:var(--acc);color:#fff;font-weight:600;font-size:17px;box-shadow:0 12px 32px rgba(30,94,255,.4)}
#stats{position:absolute;left:calc(12px + var(--sal));bottom:calc(12px + var(--sab));margin:0;padding:10px 12px;border-radius:12px;background:rgba(7,9,13,.8);border:1px solid rgba(255,255,255,.07);
color:#d6e0f2;font:12px/1.5 var(--mono);white-space:pre;pointer-events:none;max-width:calc(100vw - 24px);overflow:hidden}
@media (prefers-reduced-motion:reduce){#spin{animation-duration:2.4s}video,#bar,#pill,#pin,#go{transition:none}}
@media (max-height:480px){.card{padding:20px 22px}.logo{width:48px;height:48px;border-radius:14px;margin-bottom:10px}#pinform{margin-top:14px}}
</style>
</head>
<body>
<div id="stage">
<video id="v" autoplay muted playsinline webkit-playsinline disablepictureinpicture></video>
<div id="card" class="card" hidden>
<svg class="logo" viewBox="0 0 108 108" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3470ff"/><stop offset="1" stop-color="#1748db"/></linearGradient></defs><rect width="108" height="108" rx="32" fill="url(#lg)"/><g transform="translate(54 54) scale(1.35) translate(-54 -54)" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M37 47h34a5 5 0 0 1 5 5v18a5 5 0 0 1-5 5H37a5 5 0 0 1-5-5V52a5 5 0 0 1 5-5z"/><path d="M45.4 39.7a15 15 0 0 1 17.2 0"/><path d="M40.8 33.2a23 23 0 0 1 26.4 0" stroke-opacity=".6"/><circle cx="54" cy="61" r="6" fill="#ff4f5e" stroke="none"/></g></svg>
<h1 id="title">LocalCast</h1>
<p id="sub"></p>
<div id="spin" hidden></div>
<form id="pinform" autocomplete="off">
<input id="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="••••••" aria-label="PIN">
<p id="err" role="alert"></p>
<button id="go" type="submit" disabled data-i18n="connect">Connect</button>
</form>
</div>
<div id="pause" aria-live="polite"><div class="pi" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></div>
<h2 data-i18n="paused">Casting is paused</h2><p data-i18n="pausedHint">The picture will be back as soon as casting resumes</p></div>
<div id="pill" hidden><span id="dot"></span><span id="ptxt"></span></div>
<div id="bar">
<button id="bi" type="button" data-i18n-label="stats" aria-label="Stats (S)" title="Stats (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg></button>
<button id="bf" type="button" data-i18n-label="fullscreen" aria-label="Full screen (F)" title="Full screen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<button id="playbtn" type="button" hidden data-i18n="tapToPlay">Tap to play</button>
<pre id="stats" hidden></pre>
</div>
<script>
(function () {
'use strict';
var BACK = [500, 1000, 2000, 4000, 5000];
var TOKEN_KEY = 'localcast.token';
function $(id) { return document.getElementById(id); }
var stage = $('stage'), video = $('v'), card = $('card'), titleEl = $('title'), subEl = $('sub'), spin = $('spin'),
    form = $('pinform'), pinEl = $('pin'), errEl = $('err'), goBtn = $('go'), pill = $('pill'), dot = $('dot'),
    ptxt = $('ptxt'), playBtn = $('playbtn'), statsEl = $('stats'), biBtn = $('bi');

var state = 'connecting';
var info = null, pin = null, token = null;
var ws = null, pc = null, remoteSet = false, pendingIce = [];
var timer = null, watchdog = null, discTimer = null, lockTimer = null, hideTimer = null;
var attempt = 0, joined = false, streamInfo = null, stoppedMsg = null, senderInfo = null, latencyEst = null;
var prev = null, lastStats = null, latency = null, lastFrameT = 0, lastFrames = 0, pollN = 0, pollTimer = null;
var wakeLock = null, lastClick = 0, paused = false;
// A tab hidden this long leaves (bye) so the phone frees its encoder and Wi-Fi; it rejoins with the token when shown again.
// Long enough for a quick app switch or the iOS native-fullscreen transition. ?hide_ms=N overrides it (tests).
function qnum(name, def) { var q = new RegExp('[?&]' + name + '=(\\d+)').exec(location.search); return q ? +q[1] : def; }
var HIDE_RELEASE_MS = qnum('hide_ms', 8000);
var released = false, releaseTimer = null, hiddenAt = 0;
// ?keep=1 (or #keep=1 next to #pin=): never release when hidden, e.g. a projector or second display whose window the
// browser reports hidden. Remembered for the tab (sessionStorage), so it survives reloads after the hash was stripped;
// keep=0 turns it off again.
var KEEP_KEY = 'localcast.keep';
var keep = (function () {
  var m = /[?&]keep=([01])(?!\d)/.exec(location.search) || /[#&]keep=([01])(?!\d)/.exec(location.hash);
  try {
    if (m) { if (m[1] === '1') sessionStorage.setItem(KEEP_KEY, '1'); else sessionStorage.removeItem(KEEP_KEY); }
    else return sessionStorage.getItem(KEEP_KEY) === '1';
  } catch (e) {}
  return !!m && m[1] === '1';
})();
// Latency catch-up: a jitter buffer or a measured latency that stays high for CATCHUP_N stats polls in a row (1 s apart)
// means the receive buffer has grown and will not drain on its own: restart the PeerConnection (fresh, empty buffer).
// At most once per CATCHUP_COOLDOWN_MS. ?catchup_jb= ?catchup_lat= ?catchup_ms= override the numbers (tests).
var CATCHUP = { jb: qnum('catchup_jb', 400), lat: qnum('catchup_lat', 800), n: 5, cooldown: qnum('catchup_ms', 60000) };
var CATCHUP_COOLDOWN_MS = CATCHUP.cooldown;
var catchHist = [], lastCatchUp = 0, catchUps = 0;
// A catch-up that did not help (the next one is due soon after: the link itself is the problem,
// a restart cannot fix it) doubles the pause before the next one, up to 8x.
var catchCooldown = CATCHUP.cooldown;
// Multipath: the device can be reachable over several local paths at once (USB tethering, Ethernet, Wi-Fi, its hotspot).
// The server lists its addresses (/api/info, welcome, addresses); the socket goes to curHost (ip:port), not always to
// the page's own host. Preference usb > ethernet > wifi/hotspot > other; vpn is never used.
// ?probe_ms= ?switch_hold_ms= override the timings (tests).
var PATH_RANK = { usb: 0, ethernet: 1, wifi: 2, hotspot: 2, other: 3 };
// A probe allows 2.5 s: it runs exactly when a link is degrading, a tighter limit tore down sessions that were only slow.
var PROBE_MS = qnum('probe_ms', 3000), PROBE_TIMEOUT_MS = 2500, SWITCH_HOLD_MS = qnum('switch_hold_ms', 10000);
// Only a page opened by an IP address can move to the device's other addresses (the server accepts WebSockets from
// pages on its own IPs); opened by a name (localhost, a .local name) it keeps its one path.
var multipath = /^(\d{1,3}\.){3}\d{1,3}$/.test(location.hostname);
// Failed upgrade probes back off per address: 3 s, 6 s ... up to a minute (a cable address this viewer can't use).
var probeFails = {};
var BAD_HOST_MS = 30000, SWITCH_TIMEOUT_MS = 4000;
function withPort(h) { return /:\d+$/.test(h) ? h : h + ':80'; }
var pageHost = withPort(location.host), curHost = pageHost, addrs = [], srvPort = null;
var pathSwitches = 0, probes = 0, lastSwitchAt = 0, hostPlayed = false, badHost = {}, upRun = null, upBusy = false;
var pickGen = 0, pendingWs = null;
// Adaptive jitter buffer (receiver.jitterBufferTarget, where supported): ~0 while the link is smooth; signs of jitter
// (RTT spike, packets lost, frames dropped) raise it to JB.hi, JB.persist bad polls out of the last JB.window to JB.max;
// after JB.calmMs without such signs it steps down by JB.step every JB.stepMs. JB.max stays well below the catch-up
// limit (CATCHUP.jb). ?jb_calm_ms= ?jb_step_ms= override the timings (tests).
var JB = { hi: 150, max: 250, persist: 3, window: 5, calmMs: qnum('jb_calm_ms', 20000), stepMs: qnum('jb_step_ms', 5000),
  step: 50, rttX: 2, rttMin: 40 };
function jbInit() { return { target: 0, marks: [], rtts: [], lost: null, dropped: null, lastBad: 0, lastStep: 0, why: '' }; }
var jb = jbInit(), jbSupported = false, jbChanges = 0;

try { token = sessionStorage.getItem(TOKEN_KEY); } catch (e) {}

/* ---------- i18n ---------- */
// Plural entries are keyed by Intl.PluralRules categories; counts here are always integers.
var I18N = {
  uk: {
    connect: 'Підключитися', stats: 'Статистика (S)', fullscreen: 'На весь екран (F)', tapToPlay: 'Натисніть, щоб відтворити',
    enterPin: 'Введіть PIN', pinHint: 'Шестизначний код на екрані телефона', wrongPin: 'Невірний PIN',
    pinChanged: 'PIN змінено на телефоні. Введіть новий PIN', locked: 'Забагато спроб. Спробуйте через {n} с',
    connecting: 'Підключення…', reconnecting: 'Перепідключення…', paused: 'Трансляцію призупинено',
    pausedHint: 'Зображення з’явиться, щойно трансляцію відновлять',
    stopped: 'Трансляцію зупинено на телефоні. Очікування…', notStreaming: 'Трансляцію ще не запущено. Очікування…',
    full: 'Досягнуто ліміту глядачів', error: 'Помилка підключення. Повторюємо…',
    busy: 'Телефон уже транслює стільки глядачам, скільки може. Спробуємо ще раз за кілька секунд…',
    na: 'н/д', ms: 'мс', mbps: 'Мбіт/с', estimate: 'оцінка', hw: 'апаратний', sw: 'програмний',
    sLatency: 'Затримка', sFps: 'FPS', sSize: 'Розмір', sBitrate: 'Бітрейт', sCodec: 'Кодек', sEncoder: 'Енкодер',
    sEncode: 'Кодування', sJitter: 'Джитер-буфер', sDecode: 'Декодування', sRtt: 'RTT', sDropped: 'Пропущено',
    sLost: 'Втрачено', sPhone: 'Телефон', target: 'ціль',
    switchCable: 'Перемикаю на кабель…', switchNet: 'Перемикаю мережу…',
    frames: { one: 'кадр', few: 'кадри', many: 'кадрів', other: 'кадрів' },
    packets: { one: 'пакет', few: 'пакети', many: 'пакетів', other: 'пакетів' }
  },
  en: {
    connect: 'Connect', stats: 'Stats (S)', fullscreen: 'Full screen (F)', tapToPlay: 'Tap to play',
    enterPin: 'Enter PIN', pinHint: 'The 6-digit code on the phone screen', wrongPin: 'Wrong PIN',
    pinChanged: 'The PIN was changed on the phone. Enter the new PIN', locked: 'Too many attempts. Try again in {n} s',
    connecting: 'Connecting…', reconnecting: 'Reconnecting…', paused: 'Casting is paused',
    pausedHint: 'The picture will be back as soon as casting resumes',
    stopped: 'Casting stopped on the phone. Waiting…', notStreaming: 'Casting hasn\'t started yet. Waiting…',
    full: 'Viewer limit reached', error: 'Connection error. Retrying…',
    busy: 'The phone is already streaming to as many viewers as it can. Trying again in a few seconds…',
    na: 'n/a', ms: 'ms', mbps: 'Mbps', estimate: 'estimate', hw: 'hardware', sw: 'software',
    sLatency: 'Latency', sFps: 'FPS', sSize: 'Resolution', sBitrate: 'Bitrate', sCodec: 'Codec', sEncoder: 'Encoder',
    sEncode: 'Encode time', sJitter: 'Jitter buffer', sDecode: 'Decode time', sRtt: 'RTT', sDropped: 'Dropped',
    sLost: 'Lost', sPhone: 'Phone', target: 'target',
    switchCable: 'Switching to the cable…', switchNet: 'Switching network…',
    frames: { one: 'frame', other: 'frames' },
    packets: { one: 'packet', other: 'packets' }
  }
};
// ?lang=uk|en wins; otherwise the first Ukrainian or English entry in the browser's preferred languages.
function pickLang() {
  var q = /[?&]lang=([a-z]{2})/i.exec(location.search);
  if (q && I18N[q[1].toLowerCase()]) return q[1].toLowerCase();
  var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
  for (var i = 0; i < list.length; i++) {
    var l = String(list[i]).toLowerCase();
    if (l.indexOf('uk') === 0) return 'uk';
    if (l.indexOf('en') === 0) return 'en';
  }
  return 'en';
}
var LANG = pickLang(), TEXT = I18N[LANG];
var pluralRule = (function () {
  try { var pr = new Intl.PluralRules(LANG); return function (n) { return pr.select(n); }; }
  catch (e) { return function (n) { return n === 1 ? 'one' : 'other'; }; }
})();
function tr(k, n) { var v = TEXT[k] || I18N.en[k] || k; return n === undefined ? v : v.replace('{n}', n); }
function trCount(k, n) { var f = TEXT[k]; return n + ' ' + (f[pluralRule(n)] || f.other); }
document.documentElement.lang = LANG;
Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) { el.textContent = tr(el.getAttribute('data-i18n')); });
Array.prototype.forEach.call(document.querySelectorAll('[data-i18n-label]'), function (el) {
  var v = tr(el.getAttribute('data-i18n-label'));
  el.setAttribute('aria-label', v); el.title = v;
});

/* ---------- UI ---------- */
function setState(s) {
  state = s; stage.setAttribute('data-state', s);
  if (s !== 'playing') { clearTimeout(hideTimer); stage.classList.remove('idle'); }
}
function showCard(o) {
  titleEl.textContent = o.title || 'LocalCast';
  subEl.textContent = o.sub || '';
  spin.hidden = !o.spin;
  form.hidden = !o.form;
  errEl.textContent = o.err || '';
  card.hidden = false;
  pill.hidden = true;
  if (o.form) { updateGo(); if (o.focus) { try { pinEl.focus(); } catch (e) {} } }
}
function hideCard() { card.hidden = true; }
// problem: keep the pill on screen while idle (reconnecting); other pills fade out with the controls.
function showPill(text, color, problem) {
  ptxt.textContent = text; dot.style.background = color || 'var(--warn)';
  pill.classList.toggle('problem', !!problem); pill.hidden = false;
}
// Pause (state.streaming === false): the phone keeps the PeerConnection and sends black frames at a low rate.
// Show a still pause screen over the (transparent) video; no reconnect, no stall recovery.
function setPaused(on) {
  if (on !== paused) {
    paused = on;
    catchHist = [];
    stage.classList.toggle('paused', on);
    if (!on) lastFrameT = Date.now(); // frames were sparse during the pause: restart the stall clock
  }
  if (on && pcUp()) onFrames(); // joined during a pause: show the pause screen even before the first black frame
}
function pcUp() { var s = pc && (pc.connectionState || pc.iceConnectionState); return s === 'connected' || s === 'completed'; }
function live(on) { if (on) stage.classList.add('live'); else stage.classList.remove('live'); }
function updateGo() { goBtn.disabled = pinEl.value.length !== 6 || !!lockTimer; }

function later(ms, fn) {
  clearTimeout(timer);
  timer = setTimeout(function () { timer = null; fn(); }, ms);
}
function stopTimers() { clearTimeout(timer); timer = null; clearInterval(lockTimer); lockTimer = null; }

/* ---------- PIN form ---------- */
pinEl.addEventListener('input', function () {
  var v = pinEl.value.replace(/\D/g, '').slice(0, 6);
  if (v !== pinEl.value) pinEl.value = v;
  updateGo();
});
form.addEventListener('submit', function (e) {
  e.preventDefault();
  if (goBtn.disabled) return;
  pin = pinEl.value;
  errEl.textContent = '';
  connect();
});
function showPin(err, sub) {
  stopTimers();
  setState(err ? 'denied' : 'pin');
  live(false);
  pinEl.value = '';
  showCard({ title: tr('enterPin'), sub: sub || tr('pinHint'), form: true, err: err, focus: true });
}

/* ---------- start ---------- */
function start() {
  var m = /[#&]pin=(\d{6})(?!\d)/.exec(location.hash); // the PIN is always 6 digits, like the form
  if (m) pin = m[1];
  if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  loadInfo();
}
function loadInfo() {
